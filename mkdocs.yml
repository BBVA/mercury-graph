site_name: mercury-graph
repo_url: https://github.com/BBVA/mercury-graph/
repo_name: mercury-graph

theme:
  name: material
  features:
  - tabs
  - navigation.indexes
  - navigation.path
  - navigation.expand
  - search.suggest
  - search.highlight
  - search.share
  - content.footnote.tooltips
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
- Home: index.md
- API:
  - mercury.graph.core: reference/core.md
  - mercury.graph.embeddings: reference/embeddings.md
  - mercury.graph.evidence: reference/evidence.md
  - mercury.graph.evidence_source: reference/evidence_source.md
  - mercury.graph.evidence_how: reference/evidence_how.md
  - mercury.graph.mge: reference/evidence_cli.md
  - mercury.graph.ml: reference/ml.md
  - mercury.graph.viz: reference/viz.md

docs_dir: docs
site_dir: site

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://es.linkedin.com/showcase/bbva-ai-factory/
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/bbva_aifactory

extra_css:
- stylesheets/extra.css

markdown_extensions:
- codehilite
- admonition
- pymdownx.superfences
- pymdownx.arithmatex:
    generic: true
- footnotes

plugins:
- search
- autorefs
- mkdocstrings:
    handlers:
      python:
        options:
          show_root_heading: true
          show_submodules: true
          merge_init_into_class: true
          docstring_style: google
          filters: []

watch:
    - mercury/graph

dev_addr: 0.0.0.0:8080